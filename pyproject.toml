[project]
name = "sphnn-torch"
version = "0.1.0"
description = "PyTorch port of Stable Port-Hamiltonian Neural Networks (Roth et al. 2025) - dynax reimplemented on torch + torchdiffeq"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "torch>=2.2",
    "torchdiffeq>=0.2.4",
    "numpy>=1.26",
    "matplotlib>=3.9",
    "scipy>=1.13",
]

[build-system]
requires = ["uv_build>=0.11.7,<0.12.0"]
build-backend = "uv_build"
